<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lil Things Club | Import Existing Products</title>
<link rel="stylesheet" href="admin/products.css">
</head>
<body class="admin-page">
<main class="login-card" style="width:min(700px,calc(100% - 30px));">
  <div class="admin-logo">Lil Things Club ♡</div>
  <h1>Import Existing Products</h1>
  <p class="muted">
    This one-time tool imports your old <code>products-objects.js</code> products
    into Supabase. Existing products with the same slug are skipped.
  </p>
  <p id="status"></p>
  <button id="importBtn" class="primary-btn">Import Products</button>
  <pre id="log" style="white-space:pre-wrap;max-height:400px;overflow:auto;"></pre>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase.js"></script>
<script src="legacy-products.js"></script>
<script src="migrate-existing.js"></script>
</body>
</html>
