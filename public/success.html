<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Order Success | Lil Things Club</title>
  <link rel="stylesheet" href="style.css">
  <style>
  
    .order-summary { border: 1px solid #ddd; padding: 1rem; border-radius: 10px; }
    .summary-item { display: flex; justify-content: space-between; margin-bottom: 0.5rem; }
    .summary-line { display: flex; justify-content: space-between; font-weight: bold; margin-top: 1rem; }
    .summary-line.total { font-size: 1.2rem; }
  </style>
</head>
<body>

   <header class="nav-bar scallop">
  
  <nav class="left-nav desktop-only">
   
  </nav>
  <!-- LOGO -->
  <div class="middle-nav">
    <a class="logo" href="index.html">
      <img src="asset/logo.png" alt="logo">
    </a>
  </div>
  <!-- RIGHT NAV -->
  <nav class="right-nav">
    <!-- SHOP DROPDOWN -->
  
    <a class="icon-btn" href="cart.html">
      <img src="asset/cart.png" alt="cartic">
      
    </a>
  </nav>
</header>

<section class="success-hero">
  <h1>Thank you for your order</h1>
  <p>Your order has been successfully placed.<br>Here is your receipt</p>
</section>

<section class="receipt-wrapper">
  <div class="receipt-card">

    <h2 class="receipt-title">RECEIPT</h2>

    <div id="items"></div>

    <div class="summary-line">
      <span>Shipping</span>
      <span id="shipping"></span>
    </div>

    <div class="summary-line">
      <span>Discount</span>
      <span id="discount"></span>
    </div>

    <div class="summary-line">
      <span>Tax</span>
      <span id="tax"></span>
    </div>

    <div class="summary-line total">
      <span>Total</span>
      <span id="total"></span>
    </div>

    <div class="shipping-meta">
      <div>
        <strong>Shipping Method</strong>
        <p id="shipping-method"></p>
      </div>

      <div>
        <strong>Destination</strong>
        <p id="destination"></p>
      </div>
    </div>

    <button class="btn-outline">DOWNLOAD</button>

    <div class="receipt-actions">
      <a href="index.html" class="btn-outline small">HOME</a>
      <a href="shop.html" class="btn-outline small">CONTINUE SHOPPING</a>
    </div>

  </div>
</section>

<section class="success-footer">
  Thank you for visiting Lil Things Club.  
  Hope your snail mail brings warmth to your heart — can’t wait to see you again 💕
</section>


  <script>
    const order = JSON.parse(localStorage.getItem("lastOrder"));

    if (!order) {
      document.getElementById("order-summary").innerHTML = "<p>No order found. Please return to the shop.</p>";
    } else {
      const itemsEl = document.getElementById("items");

      order.items.forEach(item => {
        const div = document.createElement("div");
        div.className = "summary-item";
        div.innerHTML = `
          <span>${item.name} × ${item.qty}</span>
          <span>$${(item.price * item.qty).toFixed(2)}</span>
        `;
        itemsEl.appendChild(div);
      });

      document.getElementById("subtotal").textContent = `$${order.subtotal.toFixed(2)}`;
      document.getElementById("shipping").textContent = order.shipping === 0 ? "FREE 💕" : `$${order.shipping.toFixed(2)}`;
      document.getElementById("discount").textContent = order.discount ? `-$${order.discount.toFixed(2)}` : "$0.00";

      const tax = order.country === "US" ? order.total - order.subtotal - order.shipping + order.discount : 0;
      document.getElementById("tax").textContent = `$${tax.toFixed(2)}`;

      document.getElementById("total").textContent = `$${order.total.toFixed(2)}`;
      document.getElementById("shipping-method").textContent = order.shippingType;
      document.getElementById("destination").textContent = `${order.state || ""}, ${order.country}`;
    }

    // Optional: clear cart and lastOrder after viewing
    // localStorage.removeItem("cart");
    // localStorage.removeItem("lastOrder");
  </script>

</body>
</html>
