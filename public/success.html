<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Order Success | Lil Things Club</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

   <header class="nav-bar scallop">
  
  <nav class="left-nav desktop-only">
   
  </nav>
  <!-- LOGO -->
  <div class="middle-nav">
    <a class="logo" href="index.html">
      <img src="asset/logo.png" alt="logo">
    </a>
  </div>
  <!-- RIGHT NAV -->
  <nav class="right-nav">
    <!-- SHOP DROPDOWN -->
  
    <a class="icon-btn" href="cart.html">
      <img src="asset/cart.png" alt="cartic">
      
    </a>
  </nav>
</header>

<section class="success-hero">
  <h1>Thank you for your order</h1>
  <p>Your order has been successfully placed.<br>Here is your receipt</p>
</section>

<section class="receipt-wrapper scallop-top scallop-bottom">
  <div class="receipt-card">

    <h2 class="receipt-title">RECEIPT</h2>

    <div id="items"></div>

    <div class="summary-line">
      <span>Shipping</span>
      <span id="shipping"></span>
    </div>

    <div class="summary-line">
      <span>Discount</span>
      <span id="discount"></span>
    </div>

    <div class="summary-line">
      <span>Tax</span>
      <span id="tax"></span>
    </div>

    <div class="summary-line total">
      <span>Total</span>
      <span id="total"></span>
    </div>

    <div class="shipping-meta">
      <div>
       <span>Shipping Method</span> 
<span id="shipping-method"></span> 
      </div>

      <div>
       <span>Destination</span> 
<span id="destination"></span> 
      </div>
    </div>

  

    <div class="receipt-actions">
      <a href="index.html" class="btn-outline small">HOME</a>
      <a href="shop.html" class="btn-outline small">CONTINUE SHOPPING</a>
    </div>

  </div>
</section>

<section class="success-footer">
  Thank you for visiting Lil Things Club.  
  Hope your snail mail brings warmth to your heart — can’t wait to see you again 💕
</section>
  

<script>
  // ============================
  // GET PAYMENT INTENT ID
  // ============================

  const params =
    new URLSearchParams(window.location.search);

  const paymentIntentId =
    params.get("order_id");


  // ============================
  // LOAD ORDER FROM SERVER
  // ============================

  async function loadOrder() {

    const receiptCard =
      document.querySelector(".receipt-card");

    // No PaymentIntent ID
    if (!paymentIntentId) {

      receiptCard.innerHTML = `
        <p>
          No order information was found.
          Please return to the shop.
        </p>
      `;

      return;
    }


    // ============================
    // SHOW LOADING
    // ============================

    receiptCard.innerHTML = `
      <h2 class="receipt-title">RECEIPT</h2>

      <p style="text-align:center;">
        Loading your order... 💕
      </p>
    `;


    try {

     

      // ============================
      // CALL SECURE ORDER API
      // ============================
const response =
  await fetch(
    `/api/get-order?payment_intent_id=${encodeURIComponent(
      paymentIntentId
    )}`
  );

      const data =
        await response.json();


      // ============================
      // API ERROR
      // ============================

      if (!response.ok) {

        throw new Error(
          data.error ||
          "Unable to retrieve your order."
        );

      }


      // ============================
      // GET VERIFIED ORDER
      // ============================

      const order =
        data.order;


      if (!order) {

        throw new Error(
          "Order information was not found."
        );

      }


      // ============================
      // RESTORE RECEIPT HTML
      // ============================

      receiptCard.innerHTML = `

        <h2 class="receipt-title">RECEIPT</h2>

        <div id="items"></div>

        <div class="summary-line">
          <span>Shipping</span>
          <span id="shipping"></span>
        </div>

        <div class="summary-line">
          <span>Discount</span>
          <span id="discount"></span>
        </div>

        <div class="summary-line">
          <span>Tax</span>
          <span id="tax"></span>
        </div>

        <div class="summary-line total">
          <span>Total</span>
          <span id="total"></span>
        </div>

        <div class="shipping-meta">

          <div>
            <span>Shipping Method</span>
            <span id="shipping-method"></span>
          </div>

          <div>
            <span>Destination</span>
            <span id="destination"></span>
          </div>

        </div>

        <div class="receipt-actions">

          <a
            href="index.html"
            class="btn-outline small"
          >
            HOME
          </a>

          <a
            href="shop.html"
            class="btn-outline small"
          >
            CONTINUE SHOPPING
          </a>

        </div>

      `;


      // ============================
      // ITEMS
      // ============================

      const itemsEl =
        document.getElementById("items");


      if (
        Array.isArray(order.items) &&
        order.items.length > 0
      ) {

        order.items.forEach(item => {

          const div =
            document.createElement("div");

          div.className =
            "summary-item";


          /*
            Your database currently stores:

            {
              variantId: "...",
              qty: 1
            }

            So for now we display the
            variant ID until we connect
            product_variants + Products.
          */

          const itemName =
            item.name ||
            item.label ||
            "Product";


          const itemPrice =
            Number(item.price) || 0;


          const itemQty =
            Number(item.qty) || 0;


          const itemTotal =
            itemPrice * itemQty;


          div.innerHTML = `

            <span>
              ${itemName} × ${itemQty}

              ${
                item.option
                  ? `<small> (${item.option})</small>`
                  : ""
              }
            </span>

            <span>
              ${
                itemPrice > 0
                  ? `$${itemTotal.toFixed(2)}`
                  : ""
              }
            </span>

          `;


          itemsEl.appendChild(div);

        });

      } else {

        itemsEl.innerHTML = `
          <p>
            No items found for this order.
          </p>
        `;

      }


      // ============================
      // SHIPPING
      // ============================

      document.getElementById(
        "shipping"
      ).textContent =

        Number(order.shipping) === 0
          ? "FREE 💕"
          : `$${Number(
              order.shipping || 0
            ).toFixed(2)}`;


      // ============================
      // DISCOUNT
      // ============================

      document.getElementById(
        "discount"
      ).textContent =

        Number(order.discount) > 0
          ? `-$${Number(
              order.discount
            ).toFixed(2)}`
          : "$0.00";


      // ============================
      // TAX
      // ============================

      document.getElementById(
        "tax"
      ).textContent =

        `$${Number(
          order.tax || 0
        ).toFixed(2)}`;


      // ============================
      // TOTAL
      // ============================

      document.getElementById(
        "total"
      ).textContent =

        `$${Number(
          order.total || 0
        ).toFixed(2)}`;


      // ============================
      // SHIPPING METHOD
      // ============================

      document.getElementById(
        "shipping-method"
      ).textContent =

        order.shippingType ||
        "Standard";


      // ============================
      // DESTINATION
      // ============================

      document.getElementById(
        "destination"
      ).textContent =

        [
          order.address,
          order.city,
          order.state,
          order.zip,
          order.country
        ]
          .filter(Boolean)
          .join(", ");


      // ============================
      // CLEAR CART
      // ============================

      localStorage.removeItem("cart");


      const cartCount =
        document.getElementById(
          "cartCount"
        );


      if (cartCount) {

        cartCount.textContent = "0";

      }


      console.log(
        "✅ Verified order loaded:",
        order
      );


    } catch (error) {

      console.error(
        "❌ Order loading error:",
        error
      );


      receiptCard.innerHTML = `

        <h2 class="receipt-title">
          OOPS 💕
        </h2>

        <p style="text-align:center;">
          We couldn't load your order
          right now.
        </p>

        <p style="text-align:center;">
          Your payment may still have gone through.
          Please contact us if you need help.
        </p>

        <div class="receipt-actions">

          <a
            href="index.html"
            class="btn-outline small"
          >
            HOME
          </a>

          <a
            href="shop.html"
            class="btn-outline small"
          >
            CONTINUE SHOPPING
          </a>

        </div>

      `;

    }

  }


  // ============================
  // START
  // ============================

  loadOrder();

</script>

</body>
</html>
