<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Order Success | Lil Things Club</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

   <header class="nav-bar scallop">
  
  <nav class="left-nav desktop-only">
   
  </nav>
  <!-- LOGO -->
  <div class="middle-nav">
    <a class="logo" href="index.html">
      <img src="asset/logo.png" alt="logo">
    </a>
  </div>
  <!-- RIGHT NAV -->
  <nav class="right-nav">
    <!-- SHOP DROPDOWN -->
  
    <a class="icon-btn" href="cart.html">
      <img src="asset/cart.png" alt="cartic">
      
    </a>
  </nav>
</header>

<section class="success-hero">
  <h1>Thank you for your order</h1>
  <p>Your order has been successfully placed.<br>Here is your receipt</p>
</section>

<section class="receipt-wrapper scallop-top scallop-bottom">
  <div class="receipt-card">

    <h2 class="receipt-title">RECEIPT</h2>

    <div id="items"></div>

    <div class="summary-line">
      <span>Shipping</span>
      <span id="shipping"></span>
    </div>

    <div class="summary-line">
      <span>Discount</span>
      <span id="discount"></span>
    </div>

    <div class="summary-line">
      <span>Tax</span>
      <span id="tax"></span>
    </div>

    <div class="summary-line total">
      <span>Total</span>
      <span id="total"></span>
    </div>

    <div class="shipping-meta">
      <div>
       <span>Shipping Method</span> 
<span id="shipping-method"></span> 
      </div>

      <div>
       <span>Destination</span> 
<span id="destination"></span> 
      </div>
    </div>

  

    <div class="receipt-actions">
      <a href="index.html" class="btn-outline small">HOME</a>
      <a href="shop.html" class="btn-outline small">CONTINUE SHOPPING</a>
    </div>

  </div>
</section>

<section class="success-footer">
  Thank you for visiting Lil Things Club.  
  Hope your snail mail brings warmth to your heart — can’t wait to see you again 💕
</section>
  

<script>

  // ============================
  // GET ORDER ID FROM URL
  // ============================

  const params = new URLSearchParams(window.location.search);

  const orderId =
    params.get("order_id");


  // ============================
  // FIND SAVED ORDER
  // ============================

  let order = null;


  // First try the Stripe PaymentIntent-specific order
  if (orderId) {

    const savedOrder =
      localStorage.getItem(`order_${orderId}`);

    if (savedOrder) {

      try {
        order = JSON.parse(savedOrder);
      } catch (error) {
        console.error(
          "❌ Could not read saved order:",
          error
        );
      }

    }

  }


  // Fall back to normal lastOrder
  if (!order) {

    const lastOrder =
      localStorage.getItem("lastOrder");

    if (lastOrder) {

      try {
        order = JSON.parse(lastOrder);
      } catch (error) {
        console.error(
          "❌ Could not read lastOrder:",
          error
        );
      }

    }

  }


  // ============================
  // NO ORDER
  // ============================

  if (!order) {

    document.querySelector(".receipt-card").innerHTML = `
      <p>
        No order found. Please return to the shop.
      </p>
    `;

  } else {

    // ============================
    // ITEMS
    // ============================

    const itemsEl =
      document.getElementById("items");

    order.items.forEach(item => {

      const div =
        document.createElement("div");

      div.className =
        "summary-item";

      const itemTotal =
        (Number(item.price) || 0) *
        (Number(item.qty) || 0);

      div.innerHTML = `
        <span>
          ${item.name} × ${item.qty}
          ${item.option ? `<small> (${item.option})</small>` : ""}
        </span>

        <span>
          $${itemTotal.toFixed(2)}
        </span>
      `;

      itemsEl.appendChild(div);

    });


    // ============================
    // SHIPPING
    // ============================

    document.getElementById("shipping").textContent =
      Number(order.shipping) === 0
        ? "FREE 💕"
        : `$${Number(order.shipping).toFixed(2)}`;


    // ============================
    // DISCOUNT
    // ============================

    document.getElementById("discount").textContent =
      Number(order.discount) > 0
        ? `-$${Number(order.discount).toFixed(2)}`
        : "$0.00";


    // ============================
    // TAX
    // ============================

    document.getElementById("tax").textContent =
      `$${Number(order.tax || 0).toFixed(2)}`;


    // ============================
    // TOTAL
    // ============================

    document.getElementById("total").textContent =
      `$${Number(order.total || 0).toFixed(2)}`;


    // ============================
    // SHIPPING METHOD
    // ============================

    document.getElementById("shipping-method").textContent =
      order.shippingType || "Standard";


    // ============================
    // DESTINATION
    // ============================

    document.getElementById("destination").textContent =
      `${order.address || ""}, ${order.city || ""}, ${order.state || ""}, ${order.zip || ""}, ${order.country || ""}`;


    // ============================
    // CLEAR CART
    // ============================

    localStorage.removeItem("cart");

    // Update cart count if the header has one
    const cartCount =
      document.getElementById("cartCount");

    if (cartCount) {
      cartCount.textContent = "0";
    }

  }

</script>


</body>
</html>
