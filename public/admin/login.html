<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lil Things Club | Admin Login</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;500;600;700&family=Pacifico&display=swap" rel="stylesheet">
<link rel="stylesheet" href="products.css">
</head>
<body class="admin-page">
<main class="login-card">
  <div class="admin-logo">Lil Things Club ♡</div>
  <h1>Product Manager</h1>
  <p class="muted">Log in to manage your products.</p>

  <form id="loginForm">
    <label>Email
      <input id="email" type="email" autocomplete="email" required>
    </label>

    <label>Password
      <input id="password" type="password" autocomplete="current-password" required>
    </label>

    <button class="primary-btn" type="submit">Log In</button>
    <p id="loginMessage" class="message"></p>
  </form>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/supabase.js"></script>
<script src="login.js"></script>
</body>
</html>
