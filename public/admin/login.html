
<!DOCTYPE html>

<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login | Lil Things Club</title>

  <!-- Fonts -->

  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;600&display=swap" rel="stylesheet">

  <!-- Your CSS -->

  <link rel="stylesheet" href="/admin/admin.css">
  <link rel="stylesheet" href="/style.css">

  <style>
    body {
      font-family: 'Baloo 2', cursive;
      background: #fff7fb;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }

    .login-card {
      background: white;
      padding: 30px;
      border-radius: 20px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.08);
      width: 320px;
      text-align: center;
    }

    h1 {
      margin-bottom: 20px;
    }

    input {
      width: 100%;
      padding: 10px;
      margin: 10px 0;
      border-radius: 10px;
      border: 1px solid #ddd;
    }

    button {
      width: 100%;
      padding: 10px;
      border: none;
      border-radius: 10px;
      background: #ff8ecf;
      color: white;
      font-weight: bold;
      cursor: pointer;
      margin-top: 10px;
    }

    button:hover {
      background: #ff6bb5;
    }

    #error {
      color: red;
      font-size: 14px;
      margin-top: 10px;
    }
  </style>

</head>



  
<body>

  <div class="login-card">

```
<h1>Admin Login 💕</h1>

<!-- ✅ IMPORTANT: form + IDs -->
<form id="login-form">

  <input
    type="text"
    id="username"
    placeholder="Username"
    required
  >

  <input
    type="password"
    id="password"
    placeholder="Password"
    required
  >

  <button type="submit">Login</button>

  <p id="error"></p>

</form>
```

  </div>

  <!-- JS -->

  <script src="/admin/admin.js"></script>

</body>
</html>
