      padding: 20px;
      position: fixed;

    .sidebar h2 {
      margin-bottom: 30px;
    }

    .sidebar a {
      display: block;
      padding: 12px;
      margin-bottom: 10px;
      border-radius: 10px;
      text-decoration: none;
      color: #333;
      transition: 0.2s;
    }

    .sidebar a:hover {
      background: #ffe4f1;
    }

    /* MAIN */
    .main {
      margin-left: 240px;
      padding: 30px;
      width: 100%;
    }

    .header {
      display: flex;
      justify-content: space-between;

    .logout {
      background: #ff8ecf;
      border: none;

    }

  <script>
    // 🔐 Protect page
    if (localStorage.getItem("adminAuth") !== "true") {
