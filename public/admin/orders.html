  <script>
    if (localStorage.getItem("adminAuth") !== "true") {
      window.location.href = "/admin/login.html";

  <!-- Supabase -->

 <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
  <!-- JS -->

  <script src="/admin/admin.js"></script>

  <script>

    let selectedOrder = null;

   async function loadOrders() {
  const { data, error } = await supabaseClient
    .from("orders")
    .select("*")
    .order("created_at", { ascending: false });

  if (error) {
    console.error(error);
    return;
  }

  const tbody = document.getElementById("orders-body");
  tbody.innerHTML = "";

  data.forEach(order => {
    const row = document.createElement("tr");

    row.innerHTML = `
      <td>${order.id}</td>
      <td>${order.customer_email || "N/A"}</td>
      <td>$${order.total}</td>
      <td>${order.status || "pending"}</td>
    `;

    row.onclick = () => openPanel(order);

    tbody.appendChild(row);
  });
}

    function openPanel(order) {
      selectedOrder = order;

      const details = document.getElementById("order-details");

      details.innerHTML = `
        <p><strong>Name:</strong> ${order.first_name || ""} ${order.last_name || ""}</p>
        <p><strong>Email:</strong> ${order.customer_email || ""}</p>
        <p><strong>Address:</strong> ${order.address || ""}, ${order.city || ""}, ${order.state || ""}, ${order.zip || ""}</p>
        <p><strong>Country:</strong> ${order.country || ""}</p>
        <p><strong>Total:</strong> $${order.total}</p>

        <h3>Items:</h3>
        <ul>
          ${(order.items || []).map(item => `
            <li>${item.name} x${item.qty}</li>
          `).join("")}
        </ul>
      `;

      document.getElementById("order-panel").classList.add("open");
    }

    function closePanel() {
      document.getElementById("order-panel").classList.remove("open");
    }

    const search = document.getElementById("search").value;

if (search) {
  query = query.or(
    `customer_email.ilike.%${search}%,id.ilike.%${search}%`
  );
}

    let query = supabaseClient.from("orders").select("*");

if (currentFilter !== "all") {
  query = query.eq("status", currentFilter);
}

const { data } = await query.order("created_at", { ascending: false }
    
    
    async function markShipped() {
      if (!selectedOrder) return;

     await supabaseClient
        .from("orders")
        .update({ status: "shipped" })
        .eq("id", selectedOrder.id);

      closePanel();
      loadOrders();
    }

   let currentFilter = "all";

function filterOrders(status) {
  currentFilter = status;
  loadOrders();
}
    
     loadOrders();

  </script>
