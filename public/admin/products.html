<!DOCTYPE html>

<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard | Lil Things Club</title>

  <!-- Fonts -->

  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;600&display=swap" rel="stylesheet">

  <!-- Icons -->

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

  <!-- CSS -->

  <link rel="stylesheet" href="/admin/admin.css">

  <style>
    body {
      margin: 0;
      font-family: 'Baloo 2', cursive;
      background: #f9fafb;
      display: flex;
    }

    /* SIDEBAR */
    .sidebar {
      width: 220px;
      height: 100vh;
      background: #ffffff;
      border-right: 1px solid #eee;
      padding: 20px;
      position: fixed;
    }

    .sidebar h2 {
      margin-bottom: 30px;
    }

    .sidebar a {
      display: block;
      padding: 12px;
      margin-bottom: 10px;
      border-radius: 10px;
      text-decoration: none;
      color: #333;
      transition: 0.2s;
    }

    .sidebar a:hover {
      background: #ffe4f1;
    }

    /* MAIN */
    .main {
      margin-left: 240px;
      padding: 30px;
      width: 100%;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logout {
      background: #ff8ecf;
      border: none;
      padding: 8px 14px;
      border-radius: 10px;
      color: white;
      cursor: pointer;
    }

    /* CARDS */
    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 20px;
      margin-top: 30px;
    }

    .card {
      background: white;
      padding: 20px;
      border-radius: 16px;
      box-shadow: 0 5px 15px rgba(0,0,0,0.05);
    }

    .card h3 {
      margin: 0;
      font-size: 14px;
      color: #777;
    }

    .card p {
      font-size: 24px;
      margin: 10px 0 0;
      font-weight: bold;
    }

    .product-image {
      position: relative;
      background: white;
      padding: 20px;
      border-radius: 16px;
      }
    .upload-box {
  border: 2px dashed #ffb6e6;
  padding: 30px;
  text-align: center;
  border-radius: 20px;
  cursor: pointer;
  background: #fff;
  position: relative;
}
 

.upload-box.dragover {
  background: #ffe6fb;
}
       .product-name {
      position: relative;
         background: white;
      padding: 20px;
      border-radius: 16px;
      }

      .product-description {
      position: relative;
        background: white;
      padding: 20px;
      border-radius: 16px;
      }
     .product-Variants {
      position: relative;
       background: white;
      padding: 20px;
      border-radius: 16px;
      }
   

.preview-images img {
  width: 80px;
  margin: 5px;
  border-radius: 10px;
}
    .preview-card {
  border: 2px solid #eee;
  padding: 15px;
  border-radius: 15px;
  max-width: 250px;
}

.preview-card img {
  width: 100%;
  border-radius: 10px;
}

  </style>
</head>

<body>

  <!-- SIDEBAR -->

  <div class="sidebar">
    <h2>Admin 💕</h2>

```
<a href="/admin/dashboard.html"><i class="fa fa-chart-line"></i> Dashboard</a>
<a href="/admin/orders.html"><i class="fa fa-box"></i> Orders</a>
<a href="/admin/products.html"><i class="fa fa-tag"></i> Products</a>
<a href="/admin/customers.html"><i class="fa fa-users"></i> Customers</a>
```

  </div>


  
  <section class="product-image">
<h3>Add Product</h3>
    <div id="uploadBox" class="upload-box">Drag & Drop Images</div>
<input type="file" id="fileInput" multiple hidden />

<div id="previewImages" class="preview-images"></div>
    
  </section>
  
<section class="product-name">
  <h3>Title</h3>
  <div>
<input id="name" placeholder="Product name" />
    </div>
</section>
  
  <section class="product-description">
    <h3>Title</h3>
<textarea id="description" placeholder="description"></textarea>
</section>
  

  <section class="product-categories">
    <h3>Title</h3>
<input id="categories" placeholder="comma categories" />
</section>
    
<section class="product-Variants">
<h3>Variants</h3>
<input id="variantLabel" placeholder="Label" />
<input id="variantPrice" type="number" placeholder="Price" />
<input id="variantStock" type="number" placeholder="Stock" />
<button onclick="addVariant()">Add Variant</button>

<ul id="variantList"></ul>
  </section>

<button onclick="saveProduct()">Save</button>

<div id="previewCard"></div>

  <script src="/admin/admin.js"></script>
  
  <script>
  let images = [];
let variants = [];

// Upload
async function uploadToSupabase(file) {
  const fileName = Date.now() + "-" + file.name;

  const { error } = await supabase.storage
    .from("product-images")
    .upload(fileName, file);

  if (error) return null;

  return  `https://yqqodiylewlwoemyuzfd.storage.supabase.co/storage/v1/object/public/product-images/${fileName}`;
  

// Drag drop
async function handleFiles(files) {
  for (let file of files) {
    const url = await uploadToSupabase(file);
    if (url) {
      images.push(url);
      document.getElementById("previewImages").innerHTML += `<img src="${url}" />`;
      updatePreview();
    }
  }
}

// Variants
function addVariant() {
  const label = document.getElementById("variantLabel").value;
  const price = parseFloat(document.getElementById("variantPrice").value);
  const stock = parseInt(document.getElementById("variantStock").value);

  variants.push({ id: label, label, price, stock });

  document.getElementById("variantList").innerHTML += `<li>${label} - $${price}</li>`;
}

// Save
async function saveProduct() {
  const name = document.getElementById("name").value;
  const slug = name.toLowerCase().replace(/\s+/g, "-");

  await supabase.from("products").insert([{
    name,
    slug,
    price: variants[0]?.price || 0,
    image: images[0] || "",
    images,
    description: document.getElementById("description").value,
    variants,
    categories: document.getElementById("categories").value.split(",")
  }]);

  alert("Saved!");
}

// Preview
function updatePreview() {
  document.getElementById("previewCard").innerHTML = `
    <img src="${images[0] || ""}" width="100"/>
    <h4>${document.getElementById("name").value}</h4>
  `;
}
    const uploadBox = document.getElementById("uploadBox");
const fileInput = document.getElementById("fileInput");

// CLICK → open file picker
uploadBox.addEventListener("click", () => {
  fileInput.click();
});

// FILE SELECT
fileInput.addEventListener("change", (e) => {
  handleFiles(e.target.files);
});

// DRAG OVER
uploadBox.addEventListener("dragover", (e) => {
  e.preventDefault();
  uploadBox.classList.add("dragover");
});

// DRAG LEAVE
uploadBox.addEventListener("dragleave", () => {
  uploadBox.classList.remove("dragover");
});

// DROP
uploadBox.addEventListener("drop", (e) => {
  e.preventDefault();
  uploadBox.classList.remove("dragover");

  const files = e.dataTransfer.files;
  handleFiles(files);
});
</script>

</body>
</html>
