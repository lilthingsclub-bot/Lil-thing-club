<!DOCTYPE html>

<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard | Lil Things Club</title>

  <!-- Fonts -->

  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;600&display=swap" rel="stylesheet">

  <!-- Icons -->

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

  <!-- CSS -->

  <link rel="stylesheet" href="/admin/admin.css">

  <style>
    body {
      margin: 0;
      font-family: 'Baloo 2', cursive;
      background: #f9fafb;
      display: flex;
    }

    /* SIDEBAR */
    .sidebar {
      width: 220px;
      height: 100vh;
      background: #ffffff;
      border-right: 1px solid #eee;
      padding: 20px;
      position: fixed;
    }

    .sidebar h2 {
      margin-bottom: 30px;
    }

    .sidebar a {
      display: block;
      padding: 12px;
      margin-bottom: 10px;
      border-radius: 10px;
      text-decoration: none;
      color: #333;
      transition: 0.2s;
    }

    .sidebar a:hover {
      background: #ffe4f1;
    }

    /* MAIN */
    .main {
      margin-left: 240px;
      padding: 30px;
      width: 100%;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logout {
      background: #ff8ecf;
      border: none;
      padding: 8px 14px;
      border-radius: 10px;
      color: white;
      cursor: pointer;
    }

    /* CARDS */
    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 20px;
      margin-top: 30px;
    }

    .card {
      background: white;
      padding: 20px;
      border-radius: 16px;
      box-shadow: 0 5px 15px rgba(0,0,0,0.05);
    }

    .card h3 {
      margin: 0;
      font-size: 14px;
      color: #777;
    }

    .card p {
      font-size: 24px;
      margin: 10px 0 0;
      font-weight: bold;
    }

  </style>
</head>

<body>

  <!-- SIDEBAR -->

  <div class="sidebar">
    <h2>Admin 💕</h2>

```
<a href="/admin/dashboard.html"><i class="fa fa-chart-line"></i> Dashboard</a>
<a href="/admin/orders.html"><i class="fa fa-box"></i> Orders</a>
<a href="/admin/products.html"><i class="fa fa-tag"></i> Products</a>
<a href="/admin/customers.html"><i class="fa fa-users"></i> Customers</a>
```

  </div>

<h1>Add Product</h1>
  <div id="uploadBox">Drag & Drop Images</div>
<input type="file" id="fileInput" multiple hidden />
<div id="previewImages"></div>

<input id="name" placeholder="Product name" />
<textarea id="description"></textarea>

<input id="categories" placeholder="comma categories" />

<h3>Variants</h3>
<input id="variantLabel" placeholder="Label" />
<input id="variantPrice" type="number" placeholder="Price" />
<input id="variantStock" type="number" placeholder="Stock" />
<button onclick="addVariant()">Add Variant</button>

<ul id="variantList"></ul>

<button onclick="saveProduct()">Save</button>

<div id="previewCard"></div>

  <script src="admin.js"></script>

</body>
</html>
